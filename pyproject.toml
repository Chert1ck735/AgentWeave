[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agentweave"
version = "0.1.0"
description = "SDK and CLI for independent event-driven agents"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.14.1", "confluent-kafka==2.16.0",
  "typer==0.27.3", "jsonschema==4.26.0", "psutil==7.2.2", "structlog==26.1.0",
]

[project.scripts]
agentweave = "agentweave.cli.app:main"

[project.optional-dependencies]
dev = ["agentweave-dev==0.1.0"]
http = ["httpx==0.28.1"]
server = ["psycopg[binary,pool]==3.3.6"]
openai = ["openai==3.31.0"]
compatible = ["openai==3.31.0"]
anthropic = ["anthropic==1.13.0"]
gemini = ["google-genai==2.30.1"]
mcp = ["mcp==2.3.0"]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "hatchling==1.32.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "packages/agentweave-dev/src"]
asyncio_mode = "auto"
